name: CI-CD-DevSecOps

# 1. When to run
on:
  push:
    branches: [ sec-cw2 ]     # branch Render builds; add "main" later
  pull_request:

permissions:
  contents: read
  # Allows Snyk to upload SARIF so it shows under “Code Scanning”
  security-events: write

jobs:
# 2. Build & unit tests
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django tests
      run: |
        python manage.py test
# 3. Snyk SAST scan
    - name: Snyk scan
      uses: snyk/actions/python@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}      
      with:
        args: --severity-threshold=critical            
# 4. Deploy to Render
  deploy-render:
    needs: build-test            
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Render deploy
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.RENDER_SERVICE_ID }}
        api-key:    ${{ secrets.RENDER_API_KEY }}
# 5. ZAP DAST scan
  zap-dast:
    needs: deploy-render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: ZAP full scan
      uses: zaproxy/action-full-scan@v0.10.0
      with:
        target: https://ccse1.onrender.com/
        fail_action: false
        allow_issue_writing: false
        publish_html_report: false      # skip internal upload
        artifact_name: ""               # empty → no artefact step